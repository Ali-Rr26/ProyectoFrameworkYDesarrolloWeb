# Despliegue continuo en Heroku: cuando CI termina bien en un push a main (o a mano desde la
# pestaña Actions, solo sobre main), construye las imágenes de la API y de la PWA desde el
# commit que pasó CI, las sube al registro de Heroku y las publica.
#
# Preparación, una sola vez (ver GUIA_DESPLIEGUE.md):
#   - Dos apps de Heroku con stack container: la API (con Heroku Postgres y sus variables)
#     y la PWA, cada una con su dominio propio.
#   - Settings -> Environments -> production:
#       secret   HEROKU_API_KEY   (heroku authorizations:create -d "GitHub Actions")
#       variable HEROKU_API_APP   (p. ej. multicatalogo-api)
#       variable HEROKU_WEB_APP   (p. ej. multicatalogo-web)
#       variable DOMAIN           (alissonreyes.me)
#       variable API_DOMAIN       (api.alissonreyes.me)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez; uno nuevo espera a que termine el anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ matrix.name }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    strategy:
      # Si falla una imagen, la otra se publica igual (son independientes).
      fail-fast: false
      matrix:
        include:
          - name: API (Heroku)
            app_var: HEROKU_API_APP
            context: Backend
            health_path: /api/health
            domain_var: API_DOMAIN
          - name: PWA (Heroku)
            app_var: HEROKU_WEB_APP
            context: Frontend
            health_path: /
            domain_var: DOMAIN
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      APP: ${{ vars[matrix.app_var] }}
      HOST: ${{ vars[matrix.domain_var] }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Exactamente el commit que pasó CI (o el último de main si es manual).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Iniciar sesión en el registro de Heroku
        run: |
          test -n "$HEROKU_API_KEY" -a -n "$APP" -a -n "$HOST" || { echo "::error::Faltan el secreto HEROKU_API_KEY o las variables del environment production"; exit 1; }
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Construir y subir la imagen
        env:
          # Solo la PWA la usa: se fija en el bundle al compilar.
          VITE_API_URL: https://${{ vars.API_DOMAIN }}
        run: |
          image="registry.heroku.com/$APP/web"
          # Sin attestations: el registro de Heroku solo acepta un manifiesto de imagen simple.
          docker build --provenance=false --build-arg VITE_API_URL="$VITE_API_URL" -t "$image" "${{ matrix.context }}"
          docker push "$image"
          echo "IMAGE_ID=$(docker inspect "$image" --format='{{.Id}}')" >> "$GITHUB_ENV"

      - name: Publicar en Heroku
        run: |
          curl -fsS -X PATCH "https://api.heroku.com/apps/$APP/formation" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}" > /dev/null

      - name: Comprobar por HTTPS
        run: |
          # Margen para el arranque del dyno (la API aplica las migraciones al iniciar).
          for attempt in $(seq 1 24); do
            if curl -fsS -o /dev/null "https://$HOST${{ matrix.health_path }}"; then
              echo "Despliegue OK: https://$HOST${{ matrix.health_path }}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$HOST${{ matrix.health_path }} no responde; revisa heroku logs --tail -a $APP"
          exit 1
